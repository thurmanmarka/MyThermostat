# MyThermostat configuration
# Copy to config.yaml and fill in your login. config.yaml holds your American
# Standard Home password and the database password, so it is git-ignored;
# keep it chmod 600.

server:
  port: 8086
  # Keep this on 127.0.0.1: the service trusts the hub's X-Hub-Role header,
  # so it must only be reachable through MyHomeServicesHub.
  bind: 127.0.0.1
  # true = requests that bypass the hub are treated as admin (local testing only)
  allow_direct: false

# The American Standard Home app login. If the app lets you invite another
# user to your home, give this service its own account: then it can be
# removed without changing your password. The cloud locks an account after a
# few bad passwords, so after a failed sign-in this waits 15 minutes (doubling,
# up to 6 hours) before trying again.
account:
  brand: asair            # asair = American Standard; trane and nexia also work
  username: "you@example.com"
  password: "change-me"

# How often to read the thermostat from the cloud, in seconds. The app's own
# library uses 120; changes you make here are read back after 5 seconds.
poll_seconds: 120

# A schedule that couldn't run on time (the Pi was off, or the change
# failed and is being retried) still runs up to this many minutes late,
# unless the thermostat was changed by hand or by a later schedule since.
# 0 = only on time.
schedules:
  late_minutes: 360

# Outdoor high/low for the run-time table, from MyWeatherDash (the
# WXStation) on this Pi: the thermostat has no outdoor sensor.
outdoor:
  url: "http://127.0.0.1:8081"
  disabled: false

# MariaDB: readings for the charts and run time, the change log, and
# schedules. Without it the thermostat can still be controlled, but nothing
# is remembered and schedules are off.
database:
  enabled: true
  host: 127.0.0.1
  port: 3306
  name: hvac_db
  user: hvac_app
  password: "change-me"
  retention_days: 730     # readings older than this are deleted
